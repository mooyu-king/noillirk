<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>The Year Archive</title><link rel="stylesheet" href="./style.css"></head><body><aside class="archive-guide" aria-label="Fern, your archive guide"><strong id="npc-score"></strong><div id="npc-reaction" role="img" hidden></div><img id="npc-idle" src="/game-art/tabletop-friend.webp" alt="Fern waves beside the archive desk"><span id="npc-label">Fern · Your archive guide</span></aside><main>
<section id="start"><h2>The Year Archive</h2><p>File seven moments in history. How close can you get?</p><small>Lower is better. One point per year off. Timeout: 1000 points.<br>Final reaction uses your average error.</small><div class="actions"><button id="daily">▶ Daily</button><button id="practice">↻ Practice</button></div></section>
<section id="desk" hidden><header><b id="round"></b><span id="clock"></span></header><p id="prompt" aria-live="polite"></p><form><label for="year">Your year (CE)</label><div class="actions"><input id="year" inputmode="numeric" maxlength="4" pattern="[1-9][0-9]{0,3}" required placeholder="e.g. 1500" autocomplete="off"><button>File year →</button></div></form><div id="reveal" hidden><div class="score-heading"><p id="result"></p><b id="verdict"></b></div><small id="answer-detail"></small><p id="fact"></p><a id="source" target="_blank" rel="noopener noreferrer">Read the historical record ↗</a><button id="next">Next record →</button></div></section>
<section id="finish" hidden><h2>Archive complete</h2><p id="total"></p><small id="summary-note"></small><ol id="ledger"></ol><div class="actions"><button id="share">↑ Share score</button><button id="again">↻ Practice</button></div><p id="shareStatus" role="status"></p></section>
</main><script type="module" src="./game.mjs"></script></body></html>
